  <!-- ══ PAGE: DASHBOARD ══ -->
  <div class="page active" id="page-dashboard">
    <div class="section-header">
      <div>
        <div class="section-title dashboard-greeting">
            <span id="greetText">Good morning</span><span>,</span>
            <span id="greetName" class="dashboard-greeting-name">{{ user['name'] }}</span><span class="dashboard-greeting-punctuation">!</span>
        </div>
        <div class="section-sub">Here's an overview of your file system.</div>
      </div>
      
    </div>
    <div class="dashboard-overview-title">Overview</div>
    <div class="stats-row">
      <div class="stat-card" style="--stat-color:var(--pink);">
        <div class="stat-icon"><img class="ui-icon ui-icon-lg" src="/icons-pack/icons8-folder-48.png" alt=""></div>
        <div class="stat-val" style="color:var(--pink)" id="dashTotalFolders">—</div>
        <div class="stat-label">Total Folders</div>
      </div>
      <div class="stat-card" style="--stat-color:var(--sky);">
        <div class="stat-icon"><img class="ui-icon ui-icon-lg" src="/icons-pack/icons8-document-48.png" alt=""></div>
        <div class="stat-val" style="color:var(--sky)" id="dashTotalFiles">—</div>
        <div class="stat-label">Total Files</div>
      </div>
      <div class="stat-card" style="--stat-color:var(--mint);">
        <div class="stat-icon"><img class="ui-icon ui-icon-lg" src="/icons-pack/icons8-recent-48.png" alt=""></div>
        <div class="stat-val" style="color:var(--mint)" id="dashRecentCount">—</div>
        <div class="stat-label">Added This Week</div>
      </div>
      <div class="stat-card" style="--stat-color:var(--lavender);">
        <div class="stat-icon"><img class="ui-icon ui-icon-lg" src="/icons-pack/icons8-gemini-ai-48.png" alt=""></div>
        <div class="stat-val" style="color:var(--lavender)" id="dashAiSorted">—</div>
        <div class="stat-label">AI Sorted</div>
      </div>
    </div>
    <div class="section-header" style="margin-top:8px; align-items:center;">
      <div class="section-title" style="font-size:1.1rem;">Pinned Folders</div>
      <button class="btn btn-ghost" onclick="navigate('folders', document.getElementById('nav-folders'))">View All Folders</button>
    </div>
    <div class="folders-grid" id="dashPinnedFolders" style="margin-bottom:32px;">
      <div class="empty-state" style="grid-column:1/-1;padding:20px;">
        <div class="es-icon"><img class="ui-icon ui-icon-lg" src="/icons-pack/icons8-pin-48.png" alt=""></div>
        <div class="es-text">No pinned folders yet — pin one from the Folders page!</div>
      </div>
    </div>
    <div class="section-header dashboard-recent-header">
      <div class="section-title dashboard-recent-title">Recent Uploads</div>
      <div class="sort-bar dashboard-recent-sort">
        <button class="sort-chip active" onclick="setDashboardRecentSort('date',this)">Date</button>
        <button class="sort-chip" onclick="setDashboardRecentSort('name',this)">Name</button>
        <button class="sort-chip" onclick="setDashboardRecentSort('folder',this)">Folder</button>
        <button class="sort-chip" onclick="setDashboardRecentSort('type',this)">Type</button>
      </div>
    </div>
    <div class="recent-timeline" id="dashRecentList">
      <div class="empty-state"><div class="es-icon"><img class="ui-icon ui-icon-lg" src="/icons-pack/icons8-recent-48.png" alt=""></div><div class="es-text">No files yet — upload one to get started!</div></div>
    </div>
  </div>
