<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Nest</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Material+Symbols+Rounded:FILL@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reusable_style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/toast.css') }}">
  <meta name="reset-token" content="{{ token or '' }}">
</head>
<body>
<div class="blob-wrap">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>

<div class="auth-page open">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="File Nest Logo" class="auth-logo-img">
      <div>
        <div class="logo-text" style="color: var(--accent);">File Nest</div>
        <div class="logo-sub">Reset Password</div>
      </div>
    </div>
    <div class="auth-title">Create New Password</div>
    <div class="auth-sub">Enter and confirm your new File Nest password.</div>
    <div class="modal-form">
      <div>
        <label class="form-label">New Password</label>
        <input class="form-input" type="password" id="newPw" placeholder="••••••••" autocomplete="new-password" oninput="updateStrength(this)">
        <div class="pw-strength" style="margin-top:6px;">
          <div class="pw-bar"></div>
          <div class="pw-bar"></div>
          <div class="pw-bar"></div>
          <div class="pw-bar"></div>
        </div>
      </div>
      <div>
        <label class="form-label">Confirm Password</label>
        <input class="form-input" type="password" id="confirmPw" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div id="resetError" class="auth-error" style="display:none;"></div>
      <button id="resetSubmit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" onclick="resetPassword()" disabled>Reset Password</button>
    </div>
    <div class="auth-divider">Remember it? <a class="auth-link" href="{{ url_for('index') }}">Back to Login</a></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
<script src="{{ url_for('static', filename='js/password_validation.js') }}"></script>
<script src="{{ url_for('static', filename='js/password_toggle.js') }}"></script>
<script>
const resetToken = document.querySelector('meta[name="reset-token"]')?.content || '';
const resetHash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const resetAccessToken = resetHash.get('access_token') || '';

function setAuthButtonLoading(button, loading, label) {
  if (!button) return;
  if (loading) {
    if (!button.dataset.originalHtml) button.dataset.originalHtml = button.innerHTML;
    button.disabled = true;
    button.classList.add('is-loading');
    button.innerHTML = `<span class="btn-spinner"></span><span>${label || 'Loading...'}</span>`;
  } else {
    button.disabled = false;
    button.classList.remove('is-loading');
    if (button.dataset.originalHtml) {
      button.innerHTML = button.dataset.originalHtml;
      delete button.dataset.originalHtml;
    }
  }
}

function updateStrength(inputEl) {
  updatePasswordStrength(inputEl, 'resetSubmit');
}

async function resetPassword() {
  const btn = document.getElementById('resetSubmit');
  const new_password = document.getElementById('newPw').value;
  const confirm_password = document.getElementById('confirmPw').value;
  const err = document.getElementById('resetError');
  err.style.display = 'none';

  if (!new_password || !confirm_password) {
    err.textContent = 'Fill all fields.';
    err.style.display = 'block';
    return;
  }
  const passwordMessage = passwordValidationMessage(new_password);
  if (passwordMessage) {
    err.textContent = passwordMessage;
    err.style.display = 'block';
    return;
  }
  if (new_password !== confirm_password) {
    err.textContent = 'Passwords do not match.';
    err.style.display = 'block';
    return;
  }

  setAuthButtonLoading(btn, true, 'Resetting...');
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Access-Token': resetAccessToken,
      },
      body: JSON.stringify({ token: resetToken, new_password, confirm_password }),
    });
    const data = await res.json();
    if (data.success) {
      showToast('Password updated. Please log in with your new password.', 'success');
      window.location.href = '/login?reset=1';
    } else {
      err.textContent = data.message || 'Unable to reset password.';
      err.style.display = 'block';
    }
  } catch (_) {
    err.textContent = 'Something went wrong. Try again.';
    err.style.display = 'block';
  } finally {
    setAuthButtonLoading(btn, false);
  }
}

document.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') resetPassword();
});
</script>
</body>
</html>
