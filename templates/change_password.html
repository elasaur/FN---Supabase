<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Nest</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Material+Symbols+Rounded:FILL@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reusable_style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/toast.css') }}">
</head>
<body>
<div class="blob-wrap">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>

<div class="auth-page open">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="File Nest Logo" class="auth-logo-img">
      <div>
        <div class="logo-text" style="color: var(--accent);">File Nest</div>
        <div class="logo-sub">Account Security</div>
      </div>
    </div>
    <div class="auth-title">Change Password</div>
    <div class="auth-sub" id="changeSubtitle">Verify your current password, then choose a new one.</div>
    <div class="modal-form">
      <div id="currentPwGroup">
        <label class="form-label">Current Password</label>
        <input class="form-input" type="password" id="currentPw" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div>
        <label class="form-label">New Password</label>
        <input class="form-input" type="password" id="newPw" placeholder="••••••••" autocomplete="new-password" oninput="updateStrength(this)">
        <div class="pw-strength" style="margin-top:6px;">
          <div class="pw-bar"></div>
          <div class="pw-bar"></div>
          <div class="pw-bar"></div>
          <div class="pw-bar"></div>
        </div>
      </div>
      <div>
        <label class="form-label">Confirm Password</label>
        <input class="form-input" type="password" id="confirmPw" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div id="changeError" class="auth-error" style="display:none;"></div>
      <div class="modal-actions">
        <a class="btn btn-ghost" id="cancelLink" href="{{ url_for('dashboard') }}">Cancel</a>
        <button id="changeSubmit" class="btn btn-primary" onclick="changePassword()" disabled>Save Password</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
<script src="{{ url_for('static', filename='js/password_validation.js') }}"></script>
<script>
const resetHash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const resetAccessToken = resetHash.get('access_token') || '';
const recoveryMode = Boolean(resetAccessToken);

function setAuthButtonLoading(button, loading, label) {
  if (!button) return;
  if (loading) {
    if (!button.dataset.originalHtml) button.dataset.originalHtml = button.innerHTML;
    button.disabled = true;
    button.classList.add('is-loading');
    button.innerHTML = `<span class="btn-spinner"></span><span>${label || 'Loading...'}</span>`;
  } else {
    button.disabled = false;
    button.classList.remove('is-loading');
    if (button.dataset.originalHtml) {
      button.innerHTML = button.dataset.originalHtml;
      delete button.dataset.originalHtml;
    }
  }
}

function updateStrength(inputEl) {
  updatePasswordStrength(inputEl, 'changeSubmit');
}

async function changePassword() {
  const btn = document.getElementById('changeSubmit');
  const current_password = document.getElementById('currentPw').value;
  const new_password = document.getElementById('newPw').value;
  const confirm_password = document.getElementById('confirmPw').value;
  const err = document.getElementById('changeError');
  err.style.display = 'none';

  if ((!recoveryMode && !current_password) || !new_password || !confirm_password) {
    err.textContent = 'Please fill in all fields.';
    err.style.display = 'block';
    return;
  }
  const passwordMessage = passwordValidationMessage(new_password);
  if (passwordMessage) {
    err.textContent = passwordMessage;
    err.style.display = 'block';
    return;
  }
  if (new_password !== confirm_password) {
    err.textContent = 'Passwords do not match.';
    err.style.display = 'block';
    return;
  }

  setAuthButtonLoading(btn, true, 'Saving...');
  try {
    const res = await fetch(recoveryMode ? '/api/reset-password' : '/api/user/password', {
      method: recoveryMode ? 'POST' : 'PUT',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        ...(recoveryMode ? { 'X-Access-Token': resetAccessToken } : {}),
      },
      body: JSON.stringify(recoveryMode
        ? { new_password, confirm_password }
        : { current_password, new_password, confirm_password }),
    });
    const data = await res.json();
    if (data.success) {
      showToast(recoveryMode ? 'Password updated. Please log in with your new password.' : 'Password updated.', 'success');
      window.location.href = recoveryMode ? '/login?reset=1' : (document.getElementById('cancelLink')?.href || '/dashboard');
    } else {
      err.textContent = data.message || 'Unable to change password.';
      err.style.display = 'block';
    }
  } catch (_) {
    err.textContent = 'Something went wrong. Try again.';
    err.style.display = 'block';
  } finally {
    setAuthButtonLoading(btn, false);
  }
}

document.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') changePassword();
});

if (recoveryMode) {
  document.getElementById('currentPwGroup').style.display = 'none';
  document.getElementById('changeSubtitle').textContent = 'Enter and confirm your new File Nest password.';
  document.getElementById('cancelLink').href = '/login';
}
</script>
</body>
</html>
