  <!-- ══ PAGE: ALL FILES ══ -->
  <div class="page" id="page-files">
    <div class="section-header">
      <div>
        <div class="section-title">All Files</div>
        <div class="section-sub">Access, sort, and manage all uploaded files.</div>
      </div>
    </div>
    <div class="sort-bar">
      <label class="sort-control">
        <span class="sort-control-label">Sort by:</span>
        <div class="fn-dropdown">
          <button type="button" class="fn-dropdown-btn" onclick="toggleCustomDropdown(this, event)" aria-expanded="false">
            <span class="fn-dropdown-btn-main">
              <span class="fn-dropdown-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" /></svg></span>
              <span class="fn-dropdown-label" id="allFilesSortLabel">Name - Ascending</span>
            </span>
            <span class="fn-dropdown-caret" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" /></svg></span>
          </button>
          <div class="fn-dropdown-menu">
            <button type="button" class="fn-dropdown-option selected" data-group="field" onclick="setAllFilesSortField('name', this)">Name</button>
            <button type="button" class="fn-dropdown-option" data-group="field" onclick="setAllFilesSortField('date', this)">Date Created</button>
            <div class="fn-dropdown-separator"></div>
            <button type="button" class="fn-dropdown-option selected" data-group="direction" onclick="setAllFilesSortDirection('asc', this)">Ascending</button>
            <button type="button" class="fn-dropdown-option" data-group="direction" onclick="setAllFilesSortDirection('desc', this)">Descending</button>
          </div>
        </div>
      </label>
      <label class="sort-control">
        <span class="sort-control-label">Filter by:</span>
        <div class="fn-dropdown">
          <button type="button" class="fn-dropdown-btn" onclick="toggleCustomDropdown(this, event)" aria-expanded="false">
            <span class="fn-dropdown-btn-main">
              <span class="fn-dropdown-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" /></svg></span>
              <span class="fn-dropdown-label" id="allFilesTypeLabel">All file types</span>
            </span>
            <span class="fn-dropdown-caret" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" /></svg></span>
          </button>
          <div class="fn-dropdown-menu">
            <button type="button" class="fn-dropdown-option selected" onclick="setAllFilesTypeFilter('all', this)">All file types</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('pdf', this)">PDF</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('docx', this)">DOCX</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('doc', this)">DOC</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('xlsx', this)">XLSX</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('xls', this)">XLS</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('pptx', this)">PPTX</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('ppt', this)">PPT</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('txt', this)">TXT</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('jpg', this)">JPG</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('jpeg', this)">JPEG</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('png', this)">PNG</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('mp3', this)">MP3</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('mp4', this)">MP4</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('zip', this)">ZIP</button>
            <button type="button" class="fn-dropdown-option" onclick="setAllFilesTypeFilter('csv', this)">CSV</button>
          </div>
        </div>
      </label>
    </div>
    <div class="card files-table-card">
      <div class="files-table-scroll">
        <table class="file-table">
          <thead><tr><th>File</th><th>Type</th><th>Folder</th><th>Size</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody id="allFilesTbody">
            <tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text3);">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
