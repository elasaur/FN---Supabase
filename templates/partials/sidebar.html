<!-- ══════════════ SIDEBAR ══════════════ -->
<div class="sidebar" id="sidebar">
<div class="logo">
  <img src="{{ url_for('static', filename='images/logo.png') }}" 
       alt="File Nest Logo" 
       class="logo-img">

  <div>
    <div class="logo-text" style="color:#e8855a;">File Nest</div>
    <div class="logo-sub">AI-Assisted File Organization</div>
  </div>
</div>
  <div class="nav-section">
    <div class="nav-label">Main</div>
    <div class="nav-item active" id="nav-dashboard" onclick="navigate('dashboard',this)"><span class="svg-icon nav-icon icon icon-home" aria-hidden="true"></span>Dashboard</div>
    <div class="nav-item" id="nav-upload" onclick="navigate('upload',this)"><span class="svg-icon nav-icon icon icon-upload" aria-hidden="true"></span>Upload Files <span class="nav-badge">+</span></div>
  </div>
  <div class="nav-section" style="margin-top:8px;">
    <div class="nav-label">Folders</div>
    <div class="nav-item" id="nav-folders" onclick="navigate('folders',this)"><span class="svg-icon nav-icon icon icon-folder" aria-hidden="true"></span>All Folders</div>
    <div class="nav-item" id="nav-files" onclick="navigate('files',this)"><span class="svg-icon nav-icon icon icon-file" aria-hidden="true"></span>All Files</div>
    <div class="nav-item" id="nav-stats" onclick="navigate('stats',this)"><span class="svg-icon nav-icon icon icon-statistics" aria-hidden="true"></span>Statistics</div>
  </div>
  <div class="nav-section" style="margin-top:8px;">
    <div class="nav-label">Account</div>
    <div class="nav-item" id="nav-settings" onclick="navigate('settings',this)"><span class="svg-icon nav-icon icon icon-setting" aria-hidden="true"></span>Settings</div>
    <div class="nav-item" onclick="doLogout()"><span class="svg-icon nav-icon icon icon-logout" aria-hidden="true"></span>Logout</div>
  </div>
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="avatar" id="userAvatar">{{ user['name'][0].upper() }}</div>
      <div>
        <div class="user-name" id="userName">{{ user['name'] }}</div>
        <div class="user-email" id="userEmail">{{ user['email'] }}</div>
      </div>
    </div>
  </div>
</div>
