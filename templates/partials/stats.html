  <!-- PAGE: STATISTICS -->
  <div class="page" id="page-stats">
    <div class="section-header">
      <div>
        <div class="section-title">Statistics</div>
        <div class="section-sub">Track uploads, activity, and storage insights.</div>
      </div>
    </div>
    <div class="stats-summary-grid">
      <div class="card stats-card-panel storage-card">
        <div class="stats-card-title" style="--stats-title-color:var(--accent); --stats-title-bg:var(--accent3);"><span class="stats-title-icon"><span class="svg-icon filled-svg-icon stats-title-svg icon-storage" aria-hidden="true"></span></span>Storage Usage</div>
        <div id="storageUsageSummary"></div>
      </div>
      <div class="card stats-card-panel">
        <div class="stats-card-title" style="--stats-title-color:var(--lavender); --stats-title-bg:var(--lavender2);"><span class="stats-title-icon"><span class="svg-icon stats-title-svg icon-dash-ai" aria-hidden="true"></span></span>Smart Sorting Score</div>
        <div id="aiSortingSummary" class="ai-summary"></div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stats-col">
        <div class="card stats-card-panel stats-donut-card">
          <div class="stats-card-title" style="--stats-title-color:var(--sky); --stats-title-bg:var(--sky2);"><span class="stats-title-icon"><span class="svg-icon filled-svg-icon stats-title-svg icon-donut-chart" aria-hidden="true"></span></span>File Types Breakdown</div>
          <div id="typeDonutChart" class="stats-donut-wrap"></div>
        </div>
      </div>
      <div class="stats-col stats-col-stack">
        <div class="card stats-card-panel">
          <div class="stats-card-title" style="--stats-title-color:var(--mint); --stats-title-bg:var(--mint2);"><span class="stats-title-icon"><span class="svg-icon filled-svg-icon stats-title-svg icon-statistics" aria-hidden="true"></span></span>Files per Folder</div>
          <div id="folderChartBars"></div>
        </div>
      </div>
    </div>
  </div>
