  <!-- ══ PAGE: DASHBOARD ══ -->
  <div class="page active" id="page-dashboard">
    <div class="section-header">
      <div>
        <div class="section-title dashboard-greeting">
            <span id="greetText">Good morning</span><span>,</span>
            <span id="greetName" class="dashboard-greeting-name">{{ user['name'] }}</span><span class="dashboard-greeting-punctuation">!</span>
        </div>
        <div class="section-sub">Here's an overview of your file system.</div>
      </div>
      
    </div>
    <div class="stats-row">
      <div class="stat-card" style="--stat-color:var(--pink); --stat-bg:var(--pink2);">
        <div class="stat-icon"><span class="svg-icon filled-svg-icon dashboard-stat-icon icon-dash-folder" aria-hidden="true"></span></div>
        <div class="stat-val" style="color:var(--pink)" id="dashTotalFolders">—</div>
        <div class="stat-label">Total Folders</div>
      </div>
      <div class="stat-card" style="--stat-color:var(--sky); --stat-bg:var(--sky2);">
        <div class="stat-icon"><span class="svg-icon filled-svg-icon dashboard-stat-icon icon-dash-file" aria-hidden="true"></span></div>
        <div class="stat-val" style="color:var(--sky)" id="dashTotalFiles">—</div>
        <div class="stat-label">Total Files</div>
      </div>
      <div class="stat-card" style="--stat-color:var(--mint); --stat-bg:var(--mint2);">
        <div class="stat-icon"><span class="svg-icon filled-svg-icon dashboard-stat-icon icon-dash-calendar" aria-hidden="true"></span></div>
        <div class="stat-val" style="color:var(--mint)" id="dashRecentCount">—</div>
        <div class="stat-label">Added This Week</div>
      </div>
      <div class="stat-card" style="--stat-color:var(--lavender); --stat-bg:var(--lavender2);">
        <div class="stat-icon"><span class="svg-icon dashboard-stat-icon icon-dash-ai" aria-hidden="true"></span></div>
        <div class="stat-val" style="color:var(--lavender)" id="dashAiAccepted">—</div>
        <div class="stat-label">AI Suggestions Accepted</div>
      </div>
    </div>
    <div class="section-header" style="margin-top:8px; align-items:center;">
      <div class="section-title" style="font-size:1.1rem; color: var(--text2);">Pinned Folders</div>
      <button class="btn btn-ghost" onclick="navigate('folders', document.getElementById('nav-folders'))">View All Folders</button>
    </div>
    <div class="folders-grid" id="dashPinnedFolders" style="margin-bottom:32px;">
      <div class="empty-state" style="grid-column:1/-1;padding:20px;">
        <div class="es-icon"><span class="svg-icon filled-svg-icon empty-svg-icon icon-pin-folder" aria-hidden="true"></span></div>
        <div class="es-text">No pinned folders yet - pin one from the Folders page!</div>
      </div>
    </div>
    <div class="section-header dashboard-recent-header">
      <div class="dashboard-recent-heading">
        <div class="section-title dashboard-recent-title">Recent Uploads</div>
      </div>
      <div class="sort-bar dashboard-recent-sort">
        <label class="sort-control">
          <span class="sort-control-label">Sort by:</span>
          <div class="fn-dropdown">
            <button type="button" class="fn-dropdown-btn" onclick="toggleCustomDropdown(this, event)" aria-expanded="false">
              <span class="fn-dropdown-btn-main">
                <span class="fn-dropdown-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" /></svg></span>
                <span class="fn-dropdown-label" id="dashboardRecentSortLabel">Date Created - Descending</span>
              </span>
              <span class="fn-dropdown-caret" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" /></svg></span>
            </button>
            <div class="fn-dropdown-menu">
              <button type="button" class="fn-dropdown-option" data-group="field" onclick="setDashboardRecentSortField('name', this)">Name</button>
              <button type="button" class="fn-dropdown-option selected" data-group="field" onclick="setDashboardRecentSortField('date', this)">Date Created</button>
              <div class="fn-dropdown-separator"></div>
              <button type="button" class="fn-dropdown-option" data-group="direction" onclick="setDashboardRecentSortDirection('asc', this)">Ascending</button>
              <button type="button" class="fn-dropdown-option selected" data-group="direction" onclick="setDashboardRecentSortDirection('desc', this)">Descending</button>
            </div>
          </div>
        </label>
        <label class="sort-control">
          <span class="sort-control-label">Filter by:</span>
          <div class="fn-dropdown">
            <button type="button" class="fn-dropdown-btn" onclick="toggleCustomDropdown(this, event)" aria-expanded="false">
              <span class="fn-dropdown-btn-main">
                <span class="fn-dropdown-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" /></svg></span>
                <span class="fn-dropdown-label" id="dashboardRecentTypeLabel">All file types</span>
              </span>
              <span class="fn-dropdown-caret" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" /></svg></span>
            </button>
            <div class="fn-dropdown-menu">
              <button type="button" class="fn-dropdown-option selected" onclick="setDashboardRecentTypeFilter('all', this)">All file types</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('pdf', this)">PDF</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('docx', this)">DOCX</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('doc', this)">DOC</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('xlsx', this)">XLSX</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('xls', this)">XLS</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('pptx', this)">PPTX</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('ppt', this)">PPT</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('txt', this)">TXT</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('jpg', this)">JPG</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('jpeg', this)">JPEG</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('png', this)">PNG</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('mp3', this)">MP3</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('mp4', this)">MP4</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('zip', this)">ZIP</button>
              <button type="button" class="fn-dropdown-option" onclick="setDashboardRecentTypeFilter('csv', this)">CSV</button>
            </div>
          </div>
        </label>
      </div>
    </div>
    <div class="recent-timeline" id="dashRecentList">
      <div class="empty-state"><div class="es-icon"><span class="svg-icon filled-svg-icon empty-svg-icon icon-file" aria-hidden="true"></span></div><div class="es-text">No files yet - upload one to get started!</div></div>
    </div>
  </div>
