  <!-- ══ PAGE: ALL FOLDERS ══ -->
  <div class="page" id="page-folders">
    <div class="section-header">
      <div>
        <div class="section-title">All Folders</div>
        <div class="section-sub">Browse and manage your organized folders.</div>
      </div>
      <button class="btn btn-primary" onclick="openCreateFolderModal()">New Folder</button>
    </div>
    <div class="sort-bar">
      <span style="font-size:0.78rem;font-weight:800;color:var(--text3);">Sort by:</span>
      <button class="sort-chip active" data-sort="name" onclick="setFolderSort('name',this)">Name</button>
      <button class="sort-chip" data-sort="count" onclick="setFolderSort('count',this)">File Count</button>
      <button class="sort-chip" data-sort="created" onclick="setFolderSort('created',this)">Created Date</button>
      <button class="sort-chip" data-sort="modified" onclick="setFolderSort('modified',this)">Modified Date</button>
    </div>
    <div class="folders-grid" id="allFoldersList"></div>
    <button class="folder-menu-btn" onclick="toggleFolderMenu(this, event)" title="Options"></button>
    
  </div>

  <!-- ══ PAGE: SINGLE FOLDER ══ -->
  <div class="page" id="page-folder-detail">
    <button class="btn btn-ghost folder-detail-back" onclick="navigate('folders', document.getElementById('nav-folders'))">
      Back to folders
    </button>

    <div class="folder-detail-shell">
      <section class="folder-detail-files">
        <div class="folder-detail-head">
          <div class="folder-detail-header-row">
            <div class="folder-detail-title-wrap">
              <div class="section-title" id="folderFilesTitle">Folder</div>
              <div class="sort-bar folder-files-sort">
                <span class="folder-files-sort-label">Sort by:</span>
                <button class="sort-chip active" onclick="setFolderFilesSort('name',this)">Name</button>
                <button class="sort-chip" onclick="setFolderFilesSort('date',this)">Date</button>
                <button class="sort-chip" onclick="setFolderFilesSort('type',this)">Type</button>
              </div>
            </div>
            <span class="folder-files-counter" id="folderFilesCount">0 files</span>
          </div>
        </div>
        <div id="folderFilesList" class="folder-files-list-wrap"></div>
      </section>

      <aside class="folder-detail-note">
        <div class="folder-detail-panel-head">
          <div>
            <div class="folder-detail-panel-title">Note</div>
            <div class="folder-detail-panel-sub" id="folderNoteSavedAt">Not saved yet</div>
          </div>
        </div>
        <div class="folder-note-fields">
          <input id="folderNoteTitle" class="folder-note-title-input" type="text" placeholder="Title" aria-label="Note title">
          <div class="folder-note-toolbar" aria-label="Note formatting">
            <button type="button" onmousedown="event.preventDefault()" onclick="toggleNoteLineType('bullet')" title="Bullet list" aria-label="Bullet list">
              <span class="material-symbols-rounded note-toolbar-icon" aria-hidden="true">format_list_bulleted</span>
            </button>
            <button type="button" onmousedown="event.preventDefault()" onclick="toggleNoteLineType('check')" title="Checklist" aria-label="Checklist">
              <span class="material-symbols-rounded note-toolbar-icon" aria-hidden="true">checklist</span>
            </button>
          </div>
          <div id="folderNoteEditor" class="note-body-editor folder-note-editor" aria-label="Folder note"></div>
        </div>
        <div class="note-footer">
          <div class="note-footer-actions">
            <button id="folderNoteCancelBtn" class="btn btn-ghost" onclick="cancelFolderNote()" disabled>Cancel</button>
            <button id="folderNoteSaveBtn" class="btn btn-primary note-save-btn" onclick="saveFolderNote(currentFolderFilesContext.id, this)" disabled>Save note</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
