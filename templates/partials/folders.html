  <!-- ══ PAGE: ALL FOLDERS ══ -->
  <div class="page" id="page-folders">
    <div class="section-header">
      <div>
        <div class="section-title">All Folders</div>
        <div class="section-sub">Browse and manage your organized folders.</div>
      </div>
    </div>
    <div class="sort-bar">
      <label class="sort-control">
        <span class="sort-control-label">Sort by:</span>
        <div class="fn-dropdown">
          <button type="button" class="fn-dropdown-btn" onclick="toggleCustomDropdown(this, event)" aria-expanded="false">
            <span class="fn-dropdown-btn-main">
              <span class="fn-dropdown-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" /></svg></span>
              <span class="fn-dropdown-label" id="folderSortLabel">Name - Ascending</span>
            </span>
            <span class="fn-dropdown-caret" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" /></svg></span>
          </button>
          <div class="fn-dropdown-menu">
            <button type="button" class="fn-dropdown-option selected" data-group="field" onclick="setFolderSortField('name', this)">Name</button>
            <button type="button" class="fn-dropdown-option" data-group="field" onclick="setFolderSortField('created', this)">Date Created</button>
            <button type="button" class="fn-dropdown-option" data-group="field" onclick="setFolderSortField('modified', this)">Date Modified</button>
            <div class="fn-dropdown-separator"></div>
            <button type="button" class="fn-dropdown-option selected" data-group="direction" onclick="setFolderSortDirection('asc', this)">Ascending</button>
            <button type="button" class="fn-dropdown-option" data-group="direction" onclick="setFolderSortDirection('desc', this)">Descending</button>
          </div>
        </div>
      </label>
      <button class="btn btn-primary sort-action-btn" onclick="openCreateFolderModal()">
        <span class="btn-plus-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg></span>
        Add New Folder
      </button>
    </div>
    <div class="folders-grid" id="allFoldersList"></div>
    <button class="folder-menu-btn" onclick="toggleFolderMenu(this, event)" title="Options"></button>
    
  </div>

  <!-- ══ PAGE: SINGLE FOLDER ══ -->
  <div class="page" id="page-folder-detail">
    <button class="btn btn-ghost folder-detail-back" onclick="navigate('folders', document.getElementById('nav-folders'))">
      Back to folders
    </button>

    <div class="folder-detail-shell">
      <section class="folder-detail-files">
        <div class="folder-detail-head">
          <div class="folder-detail-header-row">
            <div class="folder-detail-title-wrap">
              <div class="section-title" id="folderFilesTitle">Folder</div>
              <div class="sort-bar folder-files-sort">
                <label class="sort-control">
                  <span class="sort-control-label">Sort by:</span>
                  <div class="fn-dropdown">
                    <button type="button" class="fn-dropdown-btn" onclick="toggleCustomDropdown(this, event)" aria-expanded="false">
                      <span class="fn-dropdown-btn-main">
                        <span class="fn-dropdown-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" /></svg></span>
                        <span class="fn-dropdown-label" id="folderFilesSortLabel">Name - Ascending</span>
                      </span>
                      <span class="fn-dropdown-caret" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" /></svg></span>
                    </button>
                    <div class="fn-dropdown-menu">
                      <button type="button" class="fn-dropdown-option selected" data-group="field" onclick="setFolderFilesSortField('name', this)">Name</button>
                      <button type="button" class="fn-dropdown-option" data-group="field" onclick="setFolderFilesSortField('date', this)">Date Created</button>
                      <div class="fn-dropdown-separator"></div>
                      <button type="button" class="fn-dropdown-option selected" data-group="direction" onclick="setFolderFilesSortDirection('asc', this)">Ascending</button>
                      <button type="button" class="fn-dropdown-option" data-group="direction" onclick="setFolderFilesSortDirection('desc', this)">Descending</button>
                    </div>
                  </div>
                </label>
                <label class="sort-control">
                  <span class="sort-control-label">Filter by:</span>
                  <div class="fn-dropdown">
                    <button type="button" class="fn-dropdown-btn" onclick="toggleCustomDropdown(this, event)" aria-expanded="false">
                      <span class="fn-dropdown-btn-main">
                        <span class="fn-dropdown-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" /></svg></span>
                        <span class="fn-dropdown-label" id="folderFilesTypeLabel">All file types</span>
                      </span>
                      <span class="fn-dropdown-caret" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" /></svg></span>
                    </button>
                    <div class="fn-dropdown-menu">
                      <button type="button" class="fn-dropdown-option selected" onclick="setFolderFilesTypeFilter('all', this)">All file types</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('pdf', this)">PDF</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('docx', this)">DOCX</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('doc', this)">DOC</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('xlsx', this)">XLSX</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('xls', this)">XLS</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('pptx', this)">PPTX</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('ppt', this)">PPT</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('txt', this)">TXT</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('jpg', this)">JPG</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('jpeg', this)">JPEG</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('png', this)">PNG</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('mp3', this)">MP3</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('mp4', this)">MP4</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('zip', this)">ZIP</button>
                      <button type="button" class="fn-dropdown-option" onclick="setFolderFilesTypeFilter('csv', this)">CSV</button>
                    </div>
                  </div>
                </label>
              </div>
            </div>
            <span class="folder-files-counter" id="folderFilesCount">0 files</span>
          </div>
        </div>
        <div id="folderFilesList" class="folder-files-list-wrap"></div>
      </section>

      <aside class="folder-detail-note">
        <div class="folder-detail-panel-head">
          <div>
            <div class="folder-detail-panel-title">Note</div>
            <div class="folder-detail-panel-sub" id="folderNoteSavedAt">Not saved yet</div>
          </div>
        </div>
        <div class="folder-note-fields">
          <input id="folderNoteTitle" class="folder-note-title-input" type="text" placeholder="Title" aria-label="Note title">
          <div class="folder-note-toolbar" aria-label="Note formatting">
            <button type="button" onmousedown="event.preventDefault()" onclick="toggleNoteLineType('bullet')" title="Bullet list" aria-label="Bullet list">
              <span class="material-symbols-rounded note-toolbar-icon" aria-hidden="true">format_list_bulleted</span>
            </button>
            <button type="button" onmousedown="event.preventDefault()" onclick="toggleNoteLineType('check')" title="Checklist" aria-label="Checklist">
              <span class="material-symbols-rounded note-toolbar-icon" aria-hidden="true">checklist</span>
            </button>
          </div>
          <div id="folderNoteEditor" class="note-body-editor folder-note-editor" aria-label="Folder note"></div>
        </div>
        <div class="note-footer">
          <div class="note-footer-actions">
            <button id="folderNoteCancelBtn" class="btn btn-ghost" onclick="cancelFolderNote()" disabled>Cancel</button>
            <button id="folderNoteSaveBtn" class="btn btn-primary note-save-btn" onclick="saveFolderNote(currentFolderFilesContext.id, this)" disabled>Save note</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
